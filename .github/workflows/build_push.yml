# This is the tag-triggered signed-release workflow: triggering a release/beta build (via
# workflow_dispatch) already builds, signs (see the "Sign APK" step), tags, and publishes the
# GitHub Release in this same job. A separate workflow triggered by a `v*` tag push would run
# again when this workflow pushes its own tag, publishing a duplicate release - so don't add one.
name: Build app

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build and Release v{0}', github.event.inputs.version) || github.event.commits[0].message }}

on:
  push:
    branches:
      - master
      - backport/**
    paths:
      - '**'
      - '!**.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without "v" prefix)'
        required: true
        type: string
      beta:
        description: 'Beta release'
        default: false
        required: false
        type: boolean
      message:
        description: 'Message for releases (the text at the top of changelog)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: null2264/actions/gradle-java-setup@363cb9cf3d66bd9c72ed6860142c6b2c121d7e94
        with:
          java: 17
          distro: temurin

      - name: Setup CHANGELOG parser
        uses: taiki-e/install-action@parse-changelog

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Extract branch name
        id: branch_name
        shell: bash
        run: echo "NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Normalize version input
        shell: bash
        run: |
          # Guard against accidental leading/trailing/internal whitespace from the
          # workflow_dispatch form (a stray space here previously broke the Gradle
          # invocation entirely).
          echo "INPUT_VERSION=$(echo '${{ github.event.inputs.version }}' | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Get changelog
        id: changelog
        shell: bash
        run: |
          # extended SemVer (major.minor.patch.hotfix)
          VERSION_FORMAT='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$|^Unreleased$'

          # A release/beta build (INPUT_VERSION set) needs its own `## [x.y.z]` section in
          # CHANGELOG.md - otherwise this falls back to Unreleased and the GitHub release
          # ends up with an empty/wrong body. Nightly builds (no INPUT_VERSION) don't have
          # a versioned section, so they intentionally use Unreleased.
          if [ -n "${{ env.INPUT_VERSION }}" ]; then
            if ! parse-changelog CHANGELOG.md "${{ env.INPUT_VERSION }}" --version-format "$VERSION_FORMAT" > /tmp/changelog_section 2> /dev/null; then
              echo "::error::CHANGELOG.md has no '## [${{ env.INPUT_VERSION }}]' section. Add one before building this release/beta." >&2
              exit 1
            fi
          else
            parse-changelog CHANGELOG.md Unreleased --version-format "$VERSION_FORMAT" > /tmp/changelog_section 2> /dev/null || echo "No documented changes so far..." > /tmp/changelog_section
          fi

          {
            echo "CHANGELOG<<END_OF_FILE"
            cat /tmp/changelog_section
            echo ""
            echo "END_OF_FILE"
          } >> "$GITHUB_OUTPUT"

      # PROD
      - name: Prepare release build
        if: env.INPUT_VERSION != '' && github.event.inputs.beta != 'true'
        run: |
          set -x
          echo "VERSION_TAG=v${{ env.INPUT_VERSION }}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${{ env.INPUT_VERSION }}" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardRelease" >> $GITHUB_ENV

      # BETA
      - name: Prepare beta build
        if: env.INPUT_VERSION != '' && github.event.inputs.beta == 'true'
        run: |
          set -x

          BETA_COUNT=$(git tag -l --sort=refname "v${{ env.INPUT_VERSION }}-b*" | tail -n1 | sed "s/^\S*-b//g")
          if [ -z "$BETA_COUNT" ]; then
            BETA_COUNT="1"
          else
            BETA_COUNT=$((BETA_COUNT+1))
          fi

          echo "VERSION_TAG=v${{ env.INPUT_VERSION }}-b${BETA_COUNT}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${{ env.INPUT_VERSION }}" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardBeta" >> $GITHUB_ENV

      # NIGHTLY
      - name: Prepare nightly build
        if: steps.branch_name.outputs.NAME == 'master' && env.INPUT_VERSION == ''
        run: |
          set -x
          echo "VERSION_TAG=r$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardNightly" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build the app
        if: startsWith(env.BUILD_TYPE, 'Standard')
        run: |
          if [ -n "${{ env.APP_VERSION_NAME }}" ]; then
            ./gradlew "assemble${{ env.BUILD_TYPE }}" "-PappVersionName=${{ env.APP_VERSION_NAME }}"
          else
            ./gradlew "assemble${{ env.BUILD_TYPE }}"
          fi

      - name: Run unit tests
        if: startsWith(env.BUILD_TYPE, 'Standard')
        run: ./gradlew test${{ env.BUILD_TYPE }}UnitTest

      - name: Upload R8 APK to artifact
        uses: actions/upload-artifact@v4
        if: env.VERSION_TAG != ''
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/standard/*/app*-arm64-v8a-*.apk

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        if: env.VERSION_TAG != ''
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/standard*

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: '**/build/test-results/test*/TEST-*.xml'

      - name: Get version stage
        id: version_stage
        shell: bash
        run: |
          stage=""
          case "${{ env.VERSION_TAG }}" in
            v*)
              [ "$(echo '${{ env.VERSION_TAG }}' | grep 'v*-b')" = "" ] && stage="release" || stage="beta"
              ;;
            r*) stage="nightly" ;;
          esac
          [ "$stage" = "" ] && exit 1  # something went wrong

          echo "STAGE=${stage}" >> $GITHUB_OUTPUT

      - name: Sign APK
        uses: null2264/actions/android-signer@363cb9cf3d66bd9c72ed6860142c6b2c121d7e94
        if: env.VERSION_TAG != ''
        with:
          releaseDir: app/build/outputs/apk/standard/${{ steps.version_stage.outputs.STAGE }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          summarise: true

      - name: Clean up build artifacts
        if: env.VERSION_TAG != ''
        run: |
          set -e

          dir="app/build/outputs/apk/standard/${{ steps.version_stage.outputs.STAGE }}"

          mv $dir/app-standard-universal-*-signed.apk rokku-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum rokku-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          cp $dir/app-standard-arm64-v8a-*-signed.apk rokku-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum rokku-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          cp $dir/app-standard-armeabi-v7a-*-signed.apk rokku-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum rokku-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          cp $dir/app-standard-x86-*-signed.apk rokku-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum rokku-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          cp $dir/app-standard-x86_64-*-signed.apk rokku-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum rokku-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(env.VERSION_TAG, 'v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Rokku ${{ env.VERSION_TAG }}
          body: |
            ${{ github.event.inputs.message }}

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **rokku-${{ env.VERSION_TAG }}.apk**
          files: |
            rokku-${{ env.VERSION_TAG }}.apk
            rokku-arm64-v8a-${{ env.VERSION_TAG }}.apk
            rokku-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            rokku-x86-${{ env.VERSION_TAG }}.apk
            rokku-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: ${{ github.event.inputs.beta }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly
        if: startsWith(env.VERSION_TAG, 'r')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.NIGHTLY_PAT }}
          repository: rokku-app/rokku-nightly
          tag_name: ${{ env.VERSION_TAG }}
          name: Rokku Nightly (${{ env.VERSION_TAG }})
          body: |
            > [!CAUTION]
            > _**This alpha version is for testing only!**_
            >
            > This build is triggered by commit [`${{ env.COMMIT_SHORT_HASH }}`](https://github.com/rokku-app/rokku/commit/${{ env.COMMIT_HASH }})

            It is not ready for daily use and we do not guarantee its usability. Please download the latest stable releases instead (https://github.com/rokku-app/rokku/releases/latest). If you insist, please be sure to ALWAYS backup before updating.

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **rokku-${{ env.VERSION_TAG }}.apk**
          files: |
            rokku-${{ env.VERSION_TAG }}.apk
            rokku-arm64-v8a-${{ env.VERSION_TAG }}.apk
            rokku-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            rokku-x86-${{ env.VERSION_TAG }}.apk
            rokku-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
